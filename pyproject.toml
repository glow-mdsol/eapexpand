[project]
name = "eapexpand"
version = "0.1.0"
description = "Simple EAP file expansion tool"
authors = [{ name = "Geoff Low", email = "glow@mdsol.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "dataclasses-json>=0.6.7",
    "linkml>=1.9.6",
    "linkml-model>=1.8.0",
    "mdb-parser>=0.0.3",
    "python-dotenv>=1.2.2",
]

[project.scripts]
expand = "eapexpand.cli:main"
load_usdm = "eapexpand.cli:load_usdm"
diff = "eapexpand.helpers.linkml_diff:main"

[dependency-groups]
shapes = ["rdflib>=7.5.0,<8"]
dev = [
    "pytest>=8.0.1,<9",
    "ipykernel>=6.29.5,<7",
    "pyrefly>=0.50.1",
]

[tool.uv]
default-groups = [
    "shapes",
    "dev",
]

[tool.hatch.build.targets.sdist]
include = ["src/eapexpand"]

[tool.hatch.build.targets.wheel]
include = ["src/eapexpand"]

[tool.hatch.build.targets.wheel.sources]
"src/eapexpand" = "eapexpand"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

    definition_uri: ncit:C25364
    description: One or more characters used to identify, name, or characterize the
      nature, properties, or contents of a thing.
    title: id
    aliases:
    - Identifier
    - Unique Identifier
    identifier: true
    range: string
    multivalued: false
    inlined: true
classes:
  Message:
    description: A USDM message
    attributes:
      study:
        description: USDM Study Definition
        range: Study
        required: true
        inlined: true
      usdm_version:
        description: Version of the USDM message
        aliases:
        - usdmVersion
        range: string
        required: true
      system_version:
        description: Version of the System that generated the USDM message
        aliases:
        - systemVersion
        range: string
        required: true
      system_name:
        description: Name of the System that generated the USDM message
        aliases:
        - systemName
        range: string
        required: true

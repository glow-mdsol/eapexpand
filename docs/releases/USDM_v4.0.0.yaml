      instance_type:
        description: API attribute to identify the class type
        aliases:
        - instanceType
        range: string
        multivalued: false
        inlined: true
      extension_attributes:
        description: Extension attributes for this instance
        aliases:
        - extensionAttributes
        range: ExtensionAttribute
        required: false
        multivalued: true
        inlined_as_list: true
